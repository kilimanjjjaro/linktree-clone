allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
saveExact: true
peerDependencyRules:
  allowedVersions:
    '@auth/core>nodemailer': '10'
    next-auth>nodemailer: '10'
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'
